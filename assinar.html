<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Assinatura de Ordem de Serviço</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; margin: 0; padding: 20px; color: #334155; }
    .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .header { text-align: center; margin-bottom: 24px; border-bottom: 2px solid #e2e8f0; padding-bottom: 16px; }
    .header img { max-width: 150px; }
    .info-box { background: #f1f5f9; padding: 16px; border-radius: 8px; margin-bottom: 24px; font-size: 0.9rem; line-height: 1.6; }
    .canvas-container { border: 2px dashed #cbd5e1; border-radius: 8px; background: #fff; position: relative; margin-bottom: 12px; }
    canvas { width: 100%; height: 200px; touch-action: none; display: block; border-radius: 8px; }
    .btn { display: flex; align-items: center; justify-content: center; width: 100%; padding: 14px; border-radius: 8px; border: none; font-weight: 600; font-size: 1rem; cursor: pointer; gap: 8px; }
    .btn-primary { background: #10b981; color: white; margin-bottom: 12px; }
    .btn-clear { background: rgba(239, 68, 68, 0.1); color: #ef4444; }
    .loading { text-align: center; font-weight: 600; color: #64748b; padding: 40px 0; }
  </style>
</head>
<body>

  <div class="container" id="app">
    <div class="loading" id="msg-loading">Buscando informações da OS...</div>
    
    <div id="conteudo-os" style="display: none;">
      <div class="header">
        <img src="sua-logo.PNG" alt="Bianchin Escavações" onerror="this.style.display='none'">
        <h2 style="margin: 12px 0 0; color: #0f172a;">Aprovação de Serviço</h2>
      </div>

      <div class="info-box">
        <strong>Nº da OS:</strong> <span id="lbl-os"></span><br>
        <strong>Data:</strong> <span id="lbl-data"></span><br>
        <strong>Horímetro Início:</strong> <span id="lbl-hini"></span> | <strong>Final:</strong> <span id="lbl-hfim"></span>
      </div>

      <h3 style="font-size: 1rem; margin-bottom: 8px;">Assine abaixo:</h3>
      <div class="canvas-container">
        <canvas id="canvas-cliente"></canvas>
      </div>
      
      <button class="btn btn-clear" id="btn-limpar"><i class="ph ph-eraser"></i> Limpar e refazer</button>
      <button class="btn btn-primary" id="btn-salvar"><i class="ph ph-check-circle"></i> Confirmar Assinatura</button>
    </div>
    
    <div id="msg-sucesso" style="display: none; text-align: center; padding: 40px 0;">
      <i class="ph ph-check-circle" style="font-size: 4rem; color: #10b981; margin-bottom: 16px;"></i>
      <h2 style="color: #0f172a; margin-bottom: 8px;">Assinatura Concluída!</h2>
      <p style="color: #64748b;">Muito obrigado. Você já pode fechar esta tela.</p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
    import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDY_WTOjZG_xOnmzebcnL83MBGJZPhShIE",
      authDomain: "bianchin-671f6.firebaseapp.com",
      projectId: "bianchin-671f6",
      storageBucket: "bianchin-671f6.firebasestorage.app",
      messagingSenderId: "455624189366",
      appId: "1:455624189366:web:3a907f14a62a59ddfacd17",
      measurementId: "G-H45CMN2MNB"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    // Pega o ID na URL (ex: assinar.html?id=12345)
    const urlParams = new URLSearchParams(window.location.search);
    const osId = urlParams.get('id');

    const signaturePad = new SignaturePad(document.getElementById('canvas-cliente'), {
      backgroundColor: 'rgb(255, 255, 255)'
    });

    function resizeCanvas() {
      const canvas = document.getElementById('canvas-cliente');
      const ratio = Math.max(window.devicePixelRatio || 1, 1);
      canvas.width = canvas.offsetWidth * ratio;
      canvas.height = canvas.offsetHeight * ratio;
      canvas.getContext("2d").scale(ratio, ratio);
      signaturePad.clear();
    }
    window.addEventListener("resize", resizeCanvas);

    if (!osId) {
      document.getElementById('msg-loading').textContent = "Link inválido. Nenhuma OS encontrada.";
    } else {
      // Busca a OS no banco
      getDoc(doc(db, "os", osId)).then(snapshot => {
        if (snapshot.exists()) {
          const dados = snapshot.data();
          if(dados.assinaturaBase64) {
             document.getElementById('msg-loading').style.display = 'none';
             document.getElementById('msg-sucesso').style.display = 'block';
             document.getElementById('msg-sucesso').innerHTML += "<br><p>Esta OS já foi assinada.</p>";
             return;
          }
          
          document.getElementById('lbl-os').textContent = dados.numero;
          document.getElementById('lbl-data').textContent = dados.data.split('-').reverse().join('/');
          document.getElementById('lbl-hini').textContent = dados.hini;
          document.getElementById('lbl-hfim').textContent = dados.hfim;
          
          document.getElementById('msg-loading').style.display = 'none';
          document.getElementById('conteudo-os').style.display = 'block';
          resizeCanvas();
        } else {
          document.getElementById('msg-loading').textContent = "Ordem de serviço não encontrada.";
        }
      });
    }

    document.getElementById('btn-limpar').addEventListener('click', () => signaturePad.clear());

    document.getElementById('btn-salvar').addEventListener('click', async () => {
      if (signaturePad.isEmpty()) { alert("Por favor, assine no quadro em branco."); return; }
      
      const btn = document.getElementById('btn-salvar');
      btn.textContent = "Enviando...";
      btn.disabled = true;

      const base64 = signaturePad.toDataURL('image/png');
      
      try {
        await updateDoc(doc(db, "os", osId), {
          assinaturaBase64: base64,
          status: 'Finalizada'
        });
        document.getElementById('conteudo-os').style.display = 'none';
        document.getElementById('msg-sucesso').style.display = 'block';
      } catch (err) {
        alert("Erro ao enviar assinatura. Tente novamente.");
        btn.textContent = "Confirmar Assinatura";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
